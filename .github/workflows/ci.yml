name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install graph dependencies
        if: ${{ hashFiles('Calculator_v.2.py') != '' }}
        run: python -m pip install numpy matplotlib
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
